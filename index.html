<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SubPanel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="logo"><span class="mark">Aa</span><b>SubPanel</b><small id="ver"></small></div>
    <div class="host" id="host"><i></i><span id="hostName">…</span></div>
  </header>

  <div class="update" id="update" hidden>
    <span id="updateText"></span>
    <button id="updateBtn" type="button">Обновить</button>
    <button id="updateClose" class="x" type="button" title="Скрыть">×</button>
  </div>

  <main>
    <section class="card preview">
      <div class="frame" id="frame">
        <div class="sub" id="sub">Привет, это пример субтитров!</div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Заготовки</h2>
        <div class="head-actions">
          <button id="importPreset" class="ghost tiny" type="button" title="Импортировать заготовки из JSON">Импорт</button>
          <button id="exportPreset" class="ghost tiny" type="button" title="Экспортировать свои заготовки в JSON">Экспорт</button>
          <button id="savePreset" class="ghost tiny" type="button">+ Сохранить</button>
        </div>
      </div>
      <input type="file" id="presetFileInput" accept=".json" style="display:none">
      <div class="save-row" id="saveRow" hidden>
        <input id="presetName" type="text" placeholder="Название заготовки" maxlength="28">
        <button id="presetOk" class="small" type="button">Ок</button>
      </div>
      <div id="presets" class="chips"></div>
      <label class="check"><input type="checkbox" id="instant"><span>Применять сразу при клике</span></label>
    </section>

    <section class="card">
      <h2>Стиль</h2>

      <label class="field">
        <span>Шрифт <em>PostScript-имя</em></span>
        <input id="font" type="text" list="fonts" spellcheck="false" autocomplete="off">
        <datalist id="fonts"></datalist>
      </label>

      <div class="field">
        <span>Размер</span>
        <div class="slider">
          <input id="size" type="range" min="12" max="240" step="1">
          <input id="sizeNum" type="number" min="1" max="1000">
        </div>
      </div>

      <div class="two">
        <label class="field">
          <span>Заливка</span>
          <div class="color"><input id="fill" type="color"><code id="fillHex"></code></div>
        </label>
        <label class="field">
          <span>Обводка</span>
          <div class="color"><input id="stroke" type="color"><code id="strokeHex"></code></div>
        </label>
      </div>

      <div class="field">
        <span>Толщина обводки</span>
        <div class="slider">
          <input id="strokeW" type="range" min="0" max="40" step="1">
          <input id="strokeWNum" type="number" min="0" max="200">
        </div>
      </div>

      <div class="field">
        <span>Выравнивание</span>
        <div class="seg" id="alignSeg">
          <button type="button" data-align="left">Слева</button>
          <button type="button" data-align="center">По центру</button>
          <button type="button" data-align="right">Справа</button>
        </div>
      </div>

      <div class="field ae-only">
        <span>Интервал (Tracking)</span>
        <div class="slider">
          <input id="tracking" type="range" min="-50" max="150" step="1">
          <input id="trackingNum" type="number" min="-200" max="500">
        </div>
      </div>

      <div class="field">
        <span>Регистр букв</span>
        <div class="seg" id="caseSeg">
          <button type="button" data-case="none">Обычный</button>
          <button type="button" data-case="upper">КАПС</button>
          <button type="button" data-case="sentence">Предложения</button>
          <button type="button" data-case="title">Каждое Слово</button>
          <button type="button" data-case="lower">строчные</button>
        </div>
      </div>

      <div class="field">
        <span>Перенос строк (макс. символов, 0 = выкл)</span>
        <div class="slider">
          <input id="wrap" type="range" min="0" max="60" step="2">
          <input id="wrapNum" type="number" min="0" max="100">
        </div>
      </div>

      <div class="field ae-only">
        <span>Позиция по вертикали</span>
        <div class="seg" id="posSeg">
          <button type="button" data-y="14">Верх</button>
          <button type="button" data-y="50">Центр</button>
          <button type="button" data-y="86">Низ</button>
        </div>
        <div class="slider">
          <input id="y" type="range" min="0" max="100" step="1">
          <input id="yNum" type="number" min="0" max="100">
        </div>
        <label class="check"><input type="checkbox" id="applyPos"><span>Менять позицию слоя</span></label>
      </div>

      <button id="apply" class="primary" type="button">Применить к выделенному</button>
      <p class="hint" id="applyHint"></p>
    </section>

    <section class="card ae-only">
      <div class="card-head">
        <h2>Анимация (After Effects)</h2>
      </div>
      <div class="row">
        <button id="animBounce" class="ghost wide" type="button" title="Пружинящий вылет Pop-Up">Pop-Up</button>
        <button id="animFade" class="ghost wide" type="button" title="Появление снизу">Fade Up</button>
        <button id="animWiggle" class="ghost wide" type="button" title="Живое покачивание">Wiggle</button>
        <button id="animReset" class="ghost tiny" type="button" title="Сбросить анимацию">Сброс</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Знаки препинания</h2>
        <div class="head-actions">
          <button id="marksAll" class="ghost tiny" type="button">Все</button>
          <button id="marksReset" class="ghost tiny" type="button">Сброс</button>
        </div>
      </div>
      <div id="marks" class="chips marks"></div>
      <button id="strip" class="primary alt" type="button">Убрать знаки в выделенном</button>
      <p class="hint" id="stripHint"></p>

      <div class="row censor-row">
        <button id="censorBtn" class="ghost wide" type="button" title="Заменить нецензурные слова">Запикать мат (Цензура)</button>
        <select id="censorStyle" class="ghost">
          <option value="stars">***</option>
          <option value="symbols">@#$%</option>
        </select>
      </div>

      <div class="pr-only">
        <div class="row">
          <button id="clip" class="ghost wide" type="button">Из буфера обмена</button>
          <button id="srt" class="ghost wide" type="button">SRT-файл</button>
        </div>
        <details>
          <summary>Вручную, если буфер не работает</summary>
          <textarea id="manual" rows="5" placeholder="Вставь текст субтитров сюда (Ctrl+V)"></textarea>
          <div class="row">
            <button id="manualClean" class="ghost wide" type="button">Очистить</button>
            <button id="manualCopy" class="ghost wide" type="button">Копировать</button>
          </div>
        </details>
      </div>
    </section>
  </main>

  <div id="toast" role="status"></div>
  <script src="js/main.js"></script>
</body>
</html>
